<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f0f0" />
    <title>WebMCP en acción · en vivo</title>
    <meta name="description" content="Sigue la charla en tu celular: notas, 3 preguntas por el podio, tu chasqui y tu memoria descargable. DevFest Cusco 2026." />
    <link rel="icon" href="/brand/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono:wght@300;400;500&display=swap" />
    <link rel="stylesheet" href="/src/live/live.css" />
    <script>
      try {
        const t = JSON.parse(localStorage.getItem('wmcp-cusco.live.theme') || 'null');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="./"><img src="/brand/logo-icon.svg" alt="" width="34" height="18" /><span>WebMCP · <b>en acción</b></span></a>
      <span class="score-chip" data-score hidden></span>
      <span class="me" data-me hidden></span>
    </header>
    <div class="menu">
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu-panel" aria-label="Abrir menú"><span></span><span></span><span></span></button>
      <nav class="menu-panel" id="menu-panel" hidden aria-label="Menú">
        <button type="button" data-go="live"><i data-lucide="radio"></i> En vivo</button>
        <button type="button" data-go="chasqui"><i data-lucide="sparkles"></i> Mi chasqui</button>
        <button type="button" data-go="notes"><i data-lucide="notebook-pen"></i> Mis notas y memoria</button>
        <hr />
        <div class="theme-row" data-theme-row role="group" aria-label="Tema"></div>
      </nav>
    </div>

    <p class="status" data-status role="status">Conectando…</p>
    <div class="hold" data-hold hidden role="status" aria-live="polite"></div>
    <main id="screen"></main>

    <nav class="reactions-bar" aria-label="Reacciones" data-reactions></nav>
    <script type="module" src="/src/live/main.ts"></script>
  </body>
</html>
